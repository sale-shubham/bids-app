name: Build on Dev Branch

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # ✅ latest stable

      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v4 # ✅ latest stable
        with:
          node-version: 24 # pinned to Node.js 24 (LTS)

      - name: Install dependencies
        run: npm ci # ✅ faster & cleaner than `npm install` for CI

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build
